# 5s para o painel parecer tempo real. É dashboard local: o custo do scrape
# extra é irrelevante perto da utilidade de ver a fila mexendo ao vivo.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:3000", "api-2:3000", "api-3:3000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-1:3100", "worker-2:3100"]
