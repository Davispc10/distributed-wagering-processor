name: wagering

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: wagering
  POSTGRES_USER: wagering
  POSTGRES_PASSWORD: wagering
  DB_LOCK_TIMEOUT_MS: 3000
  DB_STATEMENT_TIMEOUT_MS: 10000
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_WAGER_TRANSACTIONS_QUEUE: wager-transactions.fifo
  SQS_WAGER_TRANSACTIONS_DLQ: wager-transactions-dlq.fifo
  SQS_WAGER_EVENTS_QUEUE: wager-events.fifo
  DEFAULT_CURRENCY: BRL

x-app-deps: &app-deps
  postgres:
    condition: service_healthy
  ministack:
    condition: service_healthy
  queue-bootstrap:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ministack:
    image: ministackorg/ministack
    environment:
      MINISTACK_REGION: us-east-1
      MINISTACK_ACCOUNT_ID: "000000000000"
    ports:
      - "${MINISTACK_HOST_PORT:-4566}:4566"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:4566/_ministack/health',timeout=3)
      interval: 2s
      timeout: 5s
      retries: 30

  # Cria as filas FIFO e a redrive policy. Idempotente: pode rodar quantas vezes for.
  queue-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "scripts/bootstrap-queues.ts"]
    environment:
      <<: *app-env
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "scripts/mikro-orm-cli.ts", "migration:up"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/main-api.ts"]
    environment:
      <<: *app-env
      HTTP_PORT: 3000
      INSTANCE_ID: api-1
    ports:
      - "${API_1_PORT:-3000}:3000"
    depends_on:
      <<: *app-deps
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/main-api.ts"]
    environment:
      <<: *app-env
      HTTP_PORT: 3000
      INSTANCE_ID: api-2
    ports:
      - "${API_2_PORT:-3001}:3000"
    depends_on:
      <<: *app-deps
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/main-api.ts"]
    environment:
      <<: *app-env
      HTTP_PORT: 3000
      INSTANCE_ID: api-3
    ports:
      - "${API_3_PORT:-3002}:3000"
    depends_on:
      <<: *app-deps
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/main-worker.ts"]
    environment:
      <<: *app-env
      HTTP_PORT: 3100
      INSTANCE_ID: worker-1
    ports:
      - "${WORKER_1_PORT:-3100}:3100"
    depends_on:
      <<: *app-deps
      migrations:
        condition: service_completed_successfully
    # SIGTERM precisa chegar ao processo para o shutdown gracioso funcionar.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3100/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/main-worker.ts"]
    environment:
      <<: *app-env
      HTTP_PORT: 3100
      INSTANCE_ID: worker-2
    ports:
      - "${WORKER_2_PORT:-3101}:3100"
    depends_on:
      <<: *app-deps
      migrations:
        condition: service_completed_successfully
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3100/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Profile opt-in: `bun run infra:up` continua subindo só a aplicação, para o
  # avaliador não precisar de Grafana para rodar os testes.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Sem volume, por decisão: `down` zera o histórico. A retenção existe só
      # para o TSDB não crescer sem limite numa sessão longa.
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
